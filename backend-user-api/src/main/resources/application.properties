spring.application.name=backend-user-api

# --- Base de datos por defecto: H2 en memoria (para mvn test) ---
spring.datasource.url=jdbc:h2:mem:productosdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# --- HU 02: subida de imágenes ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${java.io.tmpdir}/producto-imagenes

# --- HU 16: Chatbot con Google AI Studio ---
# La clave viaja solo como header x-goog-api-key; si está vacía o TODOS los
# modelos fallan (429 / timeout / sin internet), ChatbotService usa el
# respaldo local en la BD: nunca se responde un HTTP 500 crudo.
gemini.api.key=AQ.Ab8RN6Liz2JCXHVEEJTLCIyML5LVATlR1I3_oTtfdgXalx7lzg
# 08-10-2026: Google retiró gemini-2.0-flash (HTTP 404) → se usa el flash vigente,
# validado con el responseSchema {mensaje, productosIds}. Fallback local intacto.
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent
# 10-10-2026: resiliencia del chatbot — modelos en cascada por prioridad.
# Si uno falla (incl. 429 Too Many Requests) se pasa al siguiente y, si todos
# fallan, manda el respaldo local. El modelo embebido en gemini.api.url (si
# existe) queda primero de la cascada; luego los de esta lista, sin duplicados.
gemini.api.modelos=gemini-3.5-flash,gemini-1.5-flash

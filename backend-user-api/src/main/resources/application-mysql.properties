# Uso: SPRING_PROFILES_ACTIVE=mysql y variables DB_* en el entorno.
# BD_Pulgatec debe existir previamente. No ejecutar contra un esquema no inspeccionado.
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:BD_Pulgatec}?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# En MySQL no crear automáticamente la cuenta demo conocida.
app.demo.enabled=false

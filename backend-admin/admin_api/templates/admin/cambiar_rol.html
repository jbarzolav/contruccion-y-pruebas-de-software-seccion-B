{% extends "admin/base_site.html" %}
{% block content %}
<p>{{ usuario.correo }} · Rol actual {{ usuario.rol }}</p>
<p>Confirma con tu cuenta administradora de PulgaTec para registrar el cambio en Auditoría.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
        <a href="{% url 'admin:admin_api_usuariocompartido_changelist' %}">Cancelar</a>
        <input type="submit" value="Guardar cambio">
    </div>
</form>
{% endblock %}
